name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Benchmark regression checker self-test
        run: |
          python3 scripts/check-benchmark-regression.py benchmarks/testdata/baseline.json benchmarks/testdata/current-ok.json --threshold 5
          if python3 scripts/check-benchmark-regression.py benchmarks/testdata/baseline.json benchmarks/testdata/current-bad.json --threshold 5; then
            echo "expected regression fixture to fail" >&2
            exit 1
          fi
      - name: Benchmark corpus and search smoke
        run: |
          ./scripts/build-benchmark-corpus.sh >/dev/null
          cargo run -q -p radare3-cli -- search .radare3/corpus/r3bench-o0 524144415245335f5345415243485f4d41524b4552 > /tmp/r3-search-hits
          test "$(wc -l < /tmp/r3-search-hits)" -ge 2
      - name: Cache and JSON integration smoke
        run: |
          cargo build -q -p radare3-cli
          r3="./target/debug/radare3"
          target=".radare3/corpus/r3bench-o0"
          cache_dir=".radare3/ci-cache"

          rm -rf "$cache_dir"
          "$r3" afl-cache "$target" "$cache_dir" > /tmp/r3-cache-first.out 2> /tmp/r3-cache-first.err
          "$r3" afl-cache "$target" "$cache_dir" > /tmp/r3-cache-second.out 2> /tmp/r3-cache-second.err
          cmp /tmp/r3-cache-first.out /tmp/r3-cache-second.out
          grep -q 'cache=miss' /tmp/r3-cache-first.err
          grep -q 'cache=hit' /tmp/r3-cache-second.err

          "$r3" ij "$target" > /tmp/r3-ij.json
          "$r3" isj "$target" > /tmp/r3-isj.json
          "$r3" iij "$target" > /tmp/r3-iij.json
          "$r3" aflj "$target" > /tmp/r3-aflj.json
          "$r3" pdfj "$target" > /tmp/r3-pdfj.json
          "$r3" agfj "$target" > /tmp/r3-agfj.json
          "$r3" izzj "$target" > /tmp/r3-izzj.json
          "$r3" /xj "$target" 524144415245335f5345415243485f4d41524b4552 > /tmp/r3-xj.json

          python3 - <<'PY'
          import json

          expected = {
              "/tmp/r3-ij.json": "radare3.info.v1",
              "/tmp/r3-isj.json": "radare3.symbols.v1",
              "/tmp/r3-iij.json": "radare3.imports.v1",
              "/tmp/r3-aflj.json": "radare3.afl.v1",
              "/tmp/r3-pdfj.json": "radare3.pdf.v1",
              "/tmp/r3-agfj.json": "radare3.agf.v1",
              "/tmp/r3-izzj.json": "radare3.izz.v1",
              "/tmp/r3-xj.json": "radare3.search.v1",
          }

          for path, schema in expected.items():
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              assert payload["schema"] == schema, (path, payload.get("schema"))

          with open("/tmp/r3-iij.json", encoding="utf-8") as handle:
              imports = json.load(handle)["imports"]
              assert imports
              assert any(item["slot"] is not None for item in imports)

          with open("/tmp/r3-aflj.json", encoding="utf-8") as handle:
              assert json.load(handle)["functions"]

          with open("/tmp/r3-pdfj.json", encoding="utf-8") as handle:
              assert json.load(handle)["instructions"]

          with open("/tmp/r3-xj.json", encoding="utf-8") as handle:
              assert len(json.load(handle)["hits"]) >= 2
          PY
      - name: Session reuse smoke
        run: |
          r3="./target/debug/radare3"
          target=".radare3/corpus/r3bench-o0"

          printf 'afl\nafij\nagfj\naxtj\naxfj\npdf\ns\npx 16\nij\nq\n' | "$r3" session "$target" > /tmp/r3-session.out 2> /tmp/r3-session.err

          test "$(grep -c 'session-analysis=miss' /tmp/r3-session.err)" -eq 1
          test "$(grep -c 'session-analysis=hit' /tmp/r3-session.err)" -eq 5
          test "$(grep -c 'session-function-index=miss' /tmp/r3-session.err)" -eq 1
          test "$(grep -c 'session-function-index=hit' /tmp/r3-session.err)" -eq 2
          test "$(grep -c 'session-xref-index=miss' /tmp/r3-session.err)" -eq 1
          test "$(grep -c 'session-xref-index=hit' /tmp/r3-session.err)" -eq 1
          grep -q 'mode=session' /tmp/r3-session.err
          grep -q '"schema":"radare3.afi.v1"' /tmp/r3-session.out
          grep -q '"schema":"radare3.agf.v1"' /tmp/r3-session.out
          grep -q '"schema":"radare3.axt.v2"' /tmp/r3-session.out
          grep -q '"schema":"radare3.axf.v2"' /tmp/r3-session.out
          grep -q '"schema":"radare3.info.v1"' /tmp/r3-session.out
      - name: Benchmark tooling syntax
        run: |
          bash -n scripts/run-benchmark-campaign.sh
          bash -n scripts/profile-analysis.sh
          bash -n scripts/bench-session.sh
          python3 -m py_compile scripts/machine-manifest.py scripts/benchmark-metadata.py scripts/check-benchmark-regression.py scripts/summarize-benchmark-campaign.py
      - name: Benchmark scaling summary self-test
        run: |
          python3 scripts/summarize-benchmark-campaign.py benchmarks/testdata/campaign             --output /tmp/r3-campaign-summary.json             --tsv /tmp/r3-campaign-summary.tsv
          python3 - <<'PY'
          import json

          with open("/tmp/r3-campaign-summary.json", encoding="utf-8") as handle:
              rows = json.load(handle)["rows"]

          assert [row["threads"] for row in rows] == [1, 2, 4]
          assert abs(rows[0]["speedup"] - 1.0) < 1e-9
          assert abs(rows[1]["speedup"] - (1.0 / 0.55)) < 1e-9
          assert abs(rows[1]["efficiency"] - ((1.0 / 0.55) / 2.0)) < 1e-9
          assert abs(rows[2]["speedup"] - (1.0 / 0.30)) < 1e-9
          assert abs(rows[2]["efficiency"] - ((1.0 / 0.30) / 4.0)) < 1e-9
          PY
